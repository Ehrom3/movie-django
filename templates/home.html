{% extends 'base.html' %}
{% block content %}

<h2>Наши фильмы</h2>
<div class="movies">
    {% for movie in movies %}
    <div class="card">
        {% if movie.cover %}
            <img
                src="{{ movie.cover.url }}"
                alt="{{ movie.name }}"
            >
        {% endif %}
        <h3>{{ movie.name }}</h3>
        <p>
            {{ movie.description }}
        </p>
        <p>
            <b>Дата выхода:</b>
            {{ movie.date_movie }}
        </p>
        <p>
            <b>Жанр:</b>
            {{ movie.Janr.name }}
        </p>
    </div>
    {% empty %}
    <p>Пока фильмов нет.</p>
    {% endfor %}
</div>
{% endblock %}
